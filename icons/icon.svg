<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Instrument / Chord Strum strings -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="3">
    <line x1="140" y1="120" x2="140" y2="392"/>
    <line x1="186" y1="120" x2="186" y2="392"/>
    <line x1="233" y1="120" x2="233" y2="392"/>
    <line x1="279" y1="120" x2="279" y2="392"/>
    <line x1="326" y1="120" x2="326" y2="392"/>
    <line x1="372" y1="120" x2="372" y2="392"/>
  </g>

  <!-- Dynamic Soundwaves / Chord Progression Waves -->
  <path d="M 120 280 C 180 180, 220 340, 280 220 C 340 100, 380 320, 400 240" 
        fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Central Musical Note & Chord Symbol -->
  <g filter="url(#glow)">
    <!-- Note Stem & Flag -->
    <path d="M 280 160 L 350 135 L 350 250 C 335 240, 310 245, 295 260 C 275 280, 280 310, 305 320 C 330 330, 355 315, 355 285 L 355 125 L 275 152 L 275 280 C 260 270, 235 275, 220 290 C 200 310, 205 340, 230 350 C 255 360, 280 345, 280 315 Z" 
          fill="url(#accentGrad)"/>
    
    <!-- Sparkles / Harmonizers -->
    <circle cx="155" cy="180" r="10" fill="#38bdf8"/>
    <circle cx="375" cy="370" r="8" fill="#ec4899"/>
    <circle cx="390" cy="180" r="6" fill="#fbbf24"/>
    <circle cx="130" cy="340" r="7" fill="#a855f7"/>
  </g>
</svg>
